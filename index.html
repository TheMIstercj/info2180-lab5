<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Database Lookup</title>
    <link rel="stylesheet" href="world.css">
    <script src="world.js" defer></script>
</head>
<body>
    <header>
        <h1>World Database Lookup</h1>
    </header>

    <main>
        <div id="controls">
            <label for="country">Country:</label>
            <input type="search" id="country" name="country" placeholder="Enter a country name">
            <div class="buttons">
                <button type="button" id="lookup">Lookup Countries</button>
                <button type="button" id="lookup-cities">Lookup Cities</button>
            </div>
        </div>

        <div id="result" aria-live="polite"></div>
    </main>
</body>
</html>
